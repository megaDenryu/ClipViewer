[package]
name = "clip_viewer"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# アプリ本体(画面・再生の時計・操作の応答・映像の供給・永続化の境界)。
# egui / SengenEgui への依存はこのクレートだけに閉じる。参照: _doc/設計/アーキテクチャ.md・_doc/設計/画面.md
[dependencies]
clip_domain.workspace = true
clip_library.workspace = true
thumbnail_cache.workspace = true
video_source.workspace = true
audio_pcm.workspace = true
audio_output.workspace = true
eframe = "0.32"
sengen_egui = { git = "https://github.com/megaDenryu/SengenEgui", rev = "ba225ce" }
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# アプリのアイコンを Windows のリソースとして実行ファイルへ埋め込む(build.rs)。採用理由は README の利用ライブラリ表
[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
